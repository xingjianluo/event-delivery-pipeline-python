[project]
name = "event-delivery-pipeline-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff.lint]
# B008: FastAPI 路由用 Query()/Body() 作为参数默认值是官方惯用法
[tool.ruff.lint.per-file-ignores]
"app/api.py" = ["B008"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
